<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>RainyClock｜九種通勤天氣組合</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0f14;
      color: #eff3f8;
      --muted: #a1acbb;
      --border: #28313d;
      --sun: #f0c571;
      --rain: #7cbbf0;
      --cloud: #bdc4d1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1180px, 100%); margin: 0 auto; padding: 52px 28px 64px; }
    header { margin-bottom: 36px; }
    .eyebrow { margin: 0 0 12px; font-size: 12px; letter-spacing: .16em; color: var(--muted); }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.035em; line-height: 1.3; font-weight: 650; }
    .intro { margin: 14px 0 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .meta span { border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; color: #b8c2cf; font-size: 12px; }
    .column-headings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-bottom: 28px; }
    .column-headings div { text-align: center; padding-bottom: 13px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .column-headings small { color: var(--muted); font-size: 12px; margin-right: 8px; }
    .weather-row + .weather-row { margin-top: 32px; }
    h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 16px; font-weight: 600; }
    h2 small { font-size: 12px; font-weight: 400; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .clear { color: var(--sun); }
    .rain { color: var(--rain); }
    .cloudy { color: var(--cloud); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    figure { margin: 0; min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: #121922; }
    .image-link { display: block; position: relative; aspect-ratio: 1086 / 951; overflow: hidden; background: #0e141c; }
    .image-link:hover { background: #182330; }
    .image-link:focus-visible { outline: 3px solid #91c6f3; outline-offset: -3px; }
    /* Focus the native weather card in the grid; links retain the untouched full screenshots. */
    img { display: block; position: absolute; width: 111.05%; max-width: none; height: auto; left: -5.525%; top: -55.625%; }
    figcaption { padding: 15px 16px 16px; font-size: 14px; line-height: 1.7; }
    .pair { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; }
    .pair b { font-weight: 500; color: #aab6c6; margin-right: 5px; }
    .view-label { display: block; color: var(--muted); font-size: 11px; margin-top: 7px; }
    footer { margin-top: 34px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    @media (max-width: 820px) {
      main { padding: 32px 18px 44px; }
      .grid, .column-headings { gap: 12px; }
      
      figcaption { padding: 11px; font-size: 13px; }
      .pair { flex-direction: column; }
      .column-headings small { display: block; margin: 0 0 4px; }
    }
    @media (max-width: 560px) {
      main { max-width: 430px; }
      header { margin-bottom: 28px; }
      .column-headings { display: none; }
      .grid { grid-template-columns: 1fr; gap: 18px; }
      .weather-row + .weather-row { margin-top: 34px; }
      
      .pair { flex-direction: row; }
      figcaption { padding: 14px 18px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">RAINYCLOCK · WEATHER PREVIEW</p>
      <h1>九種通勤天氣組合</h1>
      <p class="intro">天氣卡左側為住家（Home），右側為目的地（Work）。<br>每列固定住家天氣，依序比較目的地的晴天、雨天與陰天。點選卡片可看完整截圖。</p>
      <div class="meta"><span>示範資料</span><span>iPhone Simulator 實際截圖</span><span>2026.09.16</span></div>
    </header>

    <div class="column-headings" aria-hidden="true">
      <div><small>目的地 Work</small><span class="clear">晴天</span></div>
      <div><small>目的地 Work</small><span class="rain">雨天</span></div>
      <div><small>目的地 Work</small><span class="cloudy">陰天</span></div>
    </div>

    <section class="weather-row" aria-labelledby="home-clear">
      <h2 id="home-clear"><span class="dot clear" aria-hidden="true"></span>住家晴天 <small>Home · Clear</small></h2>
      <div class="grid">
        <figure>
          <a class="image-link" href="clear-clear.png" target="_blank" rel="noopener" aria-label="住家晴天、目的地晴天：在新分頁開啟原尺寸截圖"><img src="clear-clear.png" alt="模擬器天氣卡：左側住家晴天，右側目的地晴天" decoding="async"></a>
          <figcaption><span class="pair"><span><b>左・住家</b><span class="clear">晴天</span></span><span><b>右・目的地</b><span class="clear">晴天</span></span></span><span class="view-label">點擊截圖查看原尺寸</span></figcaption>
        </figure>
        <figure>
          <a class="image-link" href="clear-rain.png" target="_blank" rel="noopener" aria-label="住家晴天、目的地雨天：在新分頁開啟原尺寸截圖"><img src="clear-rain.png" alt="模擬器天氣卡：左側住家晴天，右側目的地雨天" decoding="async"></a>
          <figcaption><span class="pair"><span><b>左・住家</b><span class="clear">晴天</span></span><span><b>右・目的地</b><span class="rain">雨天</span></span></span><span class="view-label">點擊截圖查看原尺寸</span></figcaption>
        </figure>
        <figure>
          <a class="image-link" href="clear-cloudy.png" target="_blank" rel="noopener" aria-label="住家晴天、目的地陰天：在新分頁開啟原尺寸截圖"><img src="clear-cloudy.png" alt="模擬器天氣卡：左側住家晴天，右側目的地陰天" decoding="async"></a>
          <figcaption><span class="pair"><span><b>左・住家</b><span class="clear">晴天</span></span><span><b>右・目的地</b><span class="cloudy">陰天</span></span></span><span class="view-label">點擊截圖查看原尺寸</span></figcaption>
        </figure>
      </div>
    </section>

    <section class="weather-row" aria-labelledby="home-rain">
      <h2 id="home-rain"><span class="dot rain" aria-hidden="true"></span>住家雨天 <small>Home · Rain</small></h2>
      <div class="grid">
        <figure>
          <a class="image-link" href="rain-clear.png" target="_blank" rel="noopener" aria-label="住家雨天、目的地晴天：在新分頁開啟原尺寸截圖"><img src="rain-clear.png" alt="模擬器天氣卡：左側住家雨天，右側目的地晴天" loading="lazy" decoding="async"></a>
          <figcaption><span class="pair"><span><b>左・住家</b><span class="rain">雨天</span></span><span><b>右・目的地</b><span class="clear">晴天</span></span></span><span class="view-label">點擊截圖查看原尺寸</span></figcaption>
        </figure>
        <figure>
          <a class="image-link" href="rain-rain.png" target="_blank" rel="noopener" aria-label="住家雨天、目的地雨天：在新分頁開啟原尺寸截圖"><img src="rain-rain.png" alt="模擬器天氣卡：左側住家雨天，右側目的地雨天" loading="lazy" decoding="async"></a>
          <figcaption><span class="pair"><span><b>左・住家</b><span class="rain">雨天</span></span><span><b>右・目的地</b><span class="rain">雨天</span></span></span><span class="view-label">點擊截圖查看原尺寸</span></figcaption>
        </figure>
        <figure>
          <a class="image-link" href="rain-cloudy.png" target="_blank" rel="noopener" aria-label="住家雨天、目的地陰天：在新分頁開啟原尺寸截圖"><img src="rain-cloudy.png" alt="模擬器天氣卡：左側住家雨天，右側目的地陰天" loading="lazy" decoding="async"></a>
          <figcaption><span class="pair"><span><b>左・住家</b><span class="rain">雨天</span></span><span><b>右・目的地</b><span class="cloudy">陰天</span></span></span><span class="view-label">點擊截圖查看原尺寸</span></figcaption>
        </figure>
      </div>
    </section>

    <section class="weather-row" aria-labelledby="home-cloudy">
      <h2 id="home-cloudy"><span class="dot cloudy" aria-hidden="true"></span>住家陰天 <small>Home · Cloudy</small></h2>
      <div class="grid">
        <figure>
          <a class="image-link" href="cloudy-clear.png" target="_blank" rel="noopener" aria-label="住家陰天、目的地晴天：在新分頁開啟原尺寸截圖"><img src="cloudy-clear.png" alt="模擬器天氣卡：左側住家陰天，右側目的地晴天" loading="lazy" decoding="async"></a>
          <figcaption><span class="pair"><span><b>左・住家</b><span class="cloudy">陰天</span></span><span><b>右・目的地</b><span class="clear">晴天</span></span></span><span class="view-label">點擊截圖查看原尺寸</span></figcaption>
        </figure>
        <figure>
          <a class="image-link" href="cloudy-rain.png" target="_blank" rel="noopener" aria-label="住家陰天、目的地雨天：在新分頁開啟原尺寸截圖"><img src="cloudy-rain.png" alt="模擬器天氣卡：左側住家陰天，右側目的地雨天" loading="lazy" decoding="async"></a>
          <figcaption><span class="pair"><span><b>左・住家</b><span class="cloudy">陰天</span></span><span><b>右・目的地</b><span class="rain">雨天</span></span></span><span class="view-label">點擊截圖查看原尺寸</span></figcaption>
        </figure>
        <figure>
          <a class="image-link" href="cloudy-cloudy.png" target="_blank" rel="noopener" aria-label="住家陰天、目的地陰天：在新分頁開啟原尺寸截圖"><img src="cloudy-cloudy.png" alt="模擬器天氣卡：左側住家陰天，右側目的地陰天" loading="lazy" decoding="async"></a>
          <figcaption><span class="pair"><span><b>左・住家</b><span class="cloudy">陰天</span></span><span><b>右・目的地</b><span class="cloudy">陰天</span></span></span><span class="view-label">點擊截圖查看原尺寸</span></figcaption>
        </figure>
      </div>
    </section>
    <footer>本頁使用示範天氣資料呈現介面；截圖來自 iPhone Simulator，不代表即時天氣預報。所有圖片皆可在新分頁查看原尺寸。</footer>
  </main>
</body>
</html>
