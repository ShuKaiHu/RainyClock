name: dayoff-service CI

# The emulator suite (test/firestore.test.js) skips here because
# FIRESTORE_EMULATOR_HOST is unset; it is run by hand before a deploy, see
# dayoff-service/DEPLOYMENT.md.
on:
  push:
    paths:
      - "dayoff-service/**"
      - ".github/workflows/dayoff-service.yml"
  pull_request:
    paths:
      - "dayoff-service/**"
      - ".github/workflows/dayoff-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dayoff-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dayoff-service/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test
