  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

#rainy-ux .settings-overview .head{margin-bottom:14px}

@media(max-width:360px){#rainy-ux .stage{padding-left:15px;padding-right:15px}#rainy-ux .nav-shell{padding-left:24px;padding-right:24px}#rainy-ux .row{gap:8px;padding-left:13px;padding-right:13px}#rainy-ux .value{font-size:12px}#rainy-ux .next{font-size:11px}#rainy-ux .time-button strong{font-size:60px}}
@media(prefers-reduced-motion:reduce){#rainy-ux *{transition:none!important}}
#rainy-ux .automatic-note{display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px;font-size:12px;margin:0 4px}
#rainy-ux .sheet-sync{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;margin-top:12px;font-size:12px}
#rainy-ux .sheet-sync .link{padding:4px;white-space:nowrap}
#rainy-ux .stage.route-original{padding-top:6px}
#rainy-ux .original-addresses{display:grid;gap:12px}
#rainy-ux .original-address{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:56px;background:var(--r-field);border-radius:16px}
#rainy-ux .original-address&gt;span{font-size:14px;font-weight:600;color:var(--r-muted);min-width:44px}
#rainy-ux .original-address input{background:transparent;border:0;border-radius:0;padding:4px 0;width:100%;min-width:0;font-size:16px}
#rainy-ux .original-address button{padding:0;background:none;border:0;color:var(--r-muted);display:grid;place-items:center;width:28px;min-width:28px;height:36px}
#rainy-ux .original-address svg{width:18px;height:18px}
#rainy-ux .original-mode{display:flex;align-items:center;gap:12px;padding:14px;background:var(--r-card);border-radius:26px;margin:12px 0 22px}
#rainy-ux .original-mode&gt;span{min-width:44px;color:var(--r-muted);font-size:14px;font-weight:600}
#rainy-ux .original-mode&gt;div{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
#rainy-ux .mode-pill{min-width:0;min-height:42px;padding:8px 3px;border:0;border-radius:24px;background:var(--r-field);color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
#rainy-ux .mode-pill[aria-pressed=true]{background:var(--r-blue)}
#rainy-ux .original-preview h2{margin:0 0 14px;font-size:16px;font-weight:600;color:var(--r-muted)}
#rainy-ux .original-map{height:240px;background:#18272c;border-radius:18px;overflow:hidden;position:relative;touch-action:none;cursor:grab}
#rainy-ux .map-media{position:absolute;top:0;left:50%;width:350px;height:240px;margin-left:-175px;transform-origin:center;user-select:none;pointer-events:none}
#rainy-ux .map-media&gt;img,#rainy-ux .map-route{position:absolute;inset:0;width:100%;height:100%}
#rainy-ux .map-route{object-fit:fill}
#rainy-ux .map-pin{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-14px);color:#fff}
#rainy-ux .map-pin&gt;svg{width:29px!important;height:29px!important;padding:6px;border-radius:50%;background:var(--r-blue);box-shadow:0 2px 5px #0006}
#rainy-ux .map-pin b{font-size:11px;font-weight:600;text-shadow:0 1px 3px #000;background:#152027d9;border-radius:4px;padding:0 3px}
#rainy-ux .work-pin&gt;svg{background:#df842b}
#rainy-ux .map-center{position:absolute;right:12px;top:12px;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff29;background:#1b252ce8;color:white}
#rainy-ux .map-attribution{position:absolute;bottom:5px;left:9px;font-size:10px;color:#fff;text-shadow:0 1px 3px #000}
#rainy-ux .original-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
#rainy-ux .original-metrics&gt;div{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--r-card);border-radius:18px}
#rainy-ux .original-metrics small{font-size:12px;color:var(--r-muted)}
#rainy-ux .original-metrics strong{font-size:17px;font-weight:600}
#rainy-ux .original-preview&gt;.note{margin:14px 0 0}
#rainy-ux .original-weather{margin-top:22px}
#rainy-ux .original-weather&gt;h2{font-size:27px;font-weight:700;color:var(--r-text);margin:0 0 14px}
#rainy-ux .original-weather-grid{display:flex;gap:10px}
#rainy-ux .original-weather-card{display:flex;flex:1;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px 8px;min-height:186px;background:linear-gradient(#051f26,#05476b);border-radius:30px;text-align:center}
#rainy-ux .original-weather-card strong{font-size:16px;font-weight:600}
#rainy-ux .original-weather-card svg{width:42px!important;height:42px!important;color:#82c7ff}
#rainy-ux .original-weather-card span{font-size:14px;font-weight:500;color:#b4c5cf}
@media(max-width:360px){#rainy-ux .original-mode{flex-direction:column;align-items:flex-start;gap:9px}#rainy-ux .original-weather-card strong{font-size:14px}#rainy-ux .original-weather-card span{font-size:12px}}
