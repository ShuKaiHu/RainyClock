<style>

const state={tab:'alarm',page:'',hour:7,minute:30,lead:20,threshold:50,snooze:true,snoozeMinutes:5,sound:'經典雨聲',weekdays:[1,2,3,4,5],calendar:false,source:'taiwan',evening:true,eveningTime:'21:00',format:'12',work:false,school:false,home:'台北車站',workplace:'台北 101',mode:'開車',dirty:false,busy:false,error:false,issue:'',synced:false,armed:true,selectedDay:15,month:8,year:2026,overrides:{}};
const capture=()=>({hour:state.hour,minute:state.minute,lead:state.lead,threshold:state.threshold,sound:state.sound,snooze:state.snooze,snoozeMinutes:state.snoozeMinutes,home:state.home,workplace:state.workplace,mode:state.mode,weekdays:[...state.weekdays],calendar:state.calendar,source:state.source,overrides:{...state.overrides}});
let saved=capture(), modal='',lastFocus=null,toastTimer,scheduleTimer,syncRevision=0;
const i=(name,cls='')=>`<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iconize=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{'stroke-width':1.7}})};
const fmt=(h,m)=>state.format==='24'?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`:`${h<12?'上午':'下午'} ${h%12||12}:${String(m).padStart(2,'0')}`;
const hm=(minutes)=>fmt(Math.floor(((minutes+1440)%1440)/60),(minutes+1440)%60);
const repeats=(days=state.weekdays)=>days.length===7?'每天':days.join(',')==='1,2,3,4,5'?'每週一至五':days.length?days.map(d=>'日一二三四五六'[d]).join('、'):'尚未選擇';
const holiday=(y,m,d)=>(y===2026&&m===8&&[25,28].includes(d));
function rings(y,m,d,source=state){const key=`${y}-${m+1}-${d}`;if(source.calendar&&source.overrides[key])return source.overrides[key]==='ring';return source.weekdays.includes(new Date(y,m,d).getDay())&&!(source.calendar&&source.source==='taiwan'&&(holiday(y,m,d)||[0,6].includes(new Date(y,m,d).getDay())))}
function next(){for(let delta=0;delta<740;delta++){const date=new Date(2026,8,15+delta);if(rings(date.getFullYear(),date.getMonth(),date.getDate(),saved)){const weather=delta===0&&cfg.scenario!=='weather';const minutes=saved.hour*60+saved.minute-(weather&&70>=saved.threshold?saved.lead:0);const actual=new Date(date);actual.setMinutes(minutes);return {date,actual,weather,time:hm(minutes),label:actual.getMonth()===8&&actual.getDate()===15?'明天':`${actual.getMonth()+1}/${actual.getDate()}`,rain:weather&&70>=saved.threshold}}}return null}
const announce=text=>root.querySelector('.announcement').textContent=text;
function row(icon,title,value,action,sub=''){return `<button type="button" class="row" data-action="${action}">${i(icon)}<span class="copy">${title}${sub?`<small>${sub}</small>`:''}</span>${value?`<span class="value">${value}</span>`:''}${i('chevron-right','chev')}</button>`}
function toggle(title,key,sub=''){return `<label class="row"><span class="copy">${title}${sub?`<small>${sub}</small>`:''}</span><input type="checkbox" class="switch" data-key="${key}" ${state[key]?'checked':''} aria-label="${title}"></label>`}
function opt(text,value,key,selected){return `<button type="button" class="option" data-choice="${key}" data-value="${value}" aria-pressed="${selected}">${text}</button>`}
function header(title){return `<div class="head detail-head"><button class="back" type="button" data-action="back" aria-label="返回設定">${i('chevron-left')}</button><h1>${title}</h1></div>`}
function status(){if(state.issue)return ['請完成路線','circle-alert','pending'];if(state.busy)return ['正在更新','refresh-cw','pending'];if(state.error)return ['更新失敗','circle-alert','pending'];if(!state.armed)return [state.synced?'無響鈴日期':'尚未設定','circle','muted'];if(state.dirty)return ['正在更新','refresh-cw','pending'];return ['已啟用','circle-check','']}
function alarm(){const s=status(),n=next();return `<div class="head"><h1>鬧鐘</h1><button type="button" class="badge ${s[2]}" data-action="schedule">${i(s[1])}${s[0]}${i('chevron-right','chev')}</button></div>
<div class="hero"><div class="hero-label"><span>一般起床時間</span>${i('pencil','chev')}</div><button type="button" class="time-button" data-action="time" aria-label="更改一般起床時間，目前 ${fmt(state.hour,state.minute)}">${state.format==='12'?`<span class="period">${state.hour<12?'上午':'下午'}</span>`:''}<strong>${state.format==='24'?String(state.hour).padStart(2,'0'):state.hour%12||12}:${String(state.minute).padStart(2,'0')}</strong></button>
<div class="next">${i(state.armed?'alarm-clock':'circle')}${state.armed&&n?`<span>${state.dirty||state.error?'目前仍響於':n.label+'響鈴'} <b>${n.time}</b> · ${n.rain?'因雨提早 '+saved.lead+' 分':'一般時間'}</span>`:`<span>${state.synced?'目前沒有響鈴日期':'選好選項後會自動設定鬧鐘'}</span>`}</div>
<button type="button" class="repeat" data-action="weekdays"><span>重複</span><span>${repeats()}${state.calendar?' · 行事曆':''}</span>${i('chevron-right','chev')}</button></div>
<div class="group">${row('cloud-rain','下雨提早',state.lead+' 分鐘','rain')}${row('music-2','鈴聲',esc(state.sound),'sound')}${row('timer','稍後提醒',state.snooze?state.snoozeMinutes+' 分鐘':'關閉','snooze')}</div>
<p class="automatic-note">${state.error||state.issue?syncMarkup():'<span class="muted">變更會自動更新鬧鐘</span>'}</p>`}
function settings(){return `<div class="head"><h1>設定</h1></div><h2 style="margin-top:0">響鈴日期</h2><div class="group">${row('calendar-days','行事曆與休假日',state.calendar?'已開啟':'未開啟','dates','每週重複、國定假日與指定日期')}</div><h2>提醒與顯示</h2><div class="group">${row('moon','前晚提醒',state.evening?fmt(...state.eveningTime.split(':').map(Number)):'關閉','evening')}${row('clock-3','時間顯示',state.format==='12'?'12小時制':'24 小時制','format')}${row('bell','通知與背景更新','','permissions')}</div><h2>支援</h2><div class="group">${row('shield-check','隱私與廣告','','privacy')}${row('circle-help','使用說明與關於','','about')}</div><p class="settings-version">Rainy Clock · 1.7.0 UI/UX 提案</p>`}
function detail(){switch(state.page){
case 'dates':return `${header('行事曆與休假日')}<div class="group">${row('repeat-2','每週重複',repeats(),'weekdays')}${toggle('使用行事曆','calendar','開啟後，可略過假日或調整個別日期')}</div>${state.calendar?`<h2>日期規則</h2><div class="group">${row('calendar-check','休假日來源',state.source==='taiwan'?'台灣辦公日曆':'只用每週重複','source')}${row('calendar-days','調整指定日期','','calendar','查看哪天會響，或單獨修改一天')}</div><h2>排程與資料</h2><div class="group">${row('alarm-clock','目前的排程',state.busy?'更新中':state.error?'更新失敗':'查看','schedule')}${row('refresh-cw','假日資料','2026、2027','holiday-data')}</div><p class="note">指定日期優先於每週重複及假日規則。補班日若不在重複日期內，請手動設為響鈴。</p>`:`<p class="note">目前依每週重複日期響鈴。關閉行事曆會保留你之前的日期設定。</p>`}<h2>其他日期偏好</h2><div class="group">${row('ellipsis','停班停課偏好','尚未提供自動判斷','other')}</div><div class="automatic-note">${syncMarkup()}</div>`;
case 'evening':return `${header('前晚提醒')}<p class="note">在有鬧鐘的前一晚，提醒你確認隔天的鬧鐘與天氣。</p><div class="group">${toggle('前晚提醒','evening')}${state.evening?row('clock-3','提醒時間',fmt(...state.eveningTime.split(':').map(Number)),'evening-time'):''}</div><p class="note">提醒偏好會自動儲存。是否能收到通知，取決於 iPhone 的通知權限。</p>${row('bell','查看通知與背景更新','','permissions')}`;
case 'format':return `${header('時間顯示')}<div class="choices">${opt('12小時制','12','format',state.format==='12')}${opt('24 小時制','24','format',state.format==='24')}</div><div class="detail-time" style="padding-top:40px"><strong>${fmt(state.hour,state.minute)}</strong><p class="note">鬧鐘與提醒會使用相同格式。<br>只改變顯示，不改變響鈴時間。</p></div>`;
case 'permissions':return `${header('通知與背景更新')}<div class="group"><div class="row"><span class="copy">通知<small>用來接收前晚提醒</small></span><span class="value">已允許 · 示範</span></div><div class="row"><span class="copy">背景 App 重新整理<small>協助更新天氣與鬧鐘</small></span><span class="value">已開啟 · 示範</span></div></div><p class="note">iOS 決定背景更新時機，無法保證每次執行。若已關閉背景更新，請定期開啟 App，確認最新排程。</p><button class="primary" type="button" data-action="system">開啟 iPhone 設定</button><p class="note">通知被拒絕時可到 App 設定修改；背景更新在 iPhone「一般」設定內。</p>`;

sheet.innerHTML=`<div class="grabber" aria-hidden="true"></div><div class="sheet-head"><h2 id="r-sheet-title">${title}</h2><button class="close" type="button" data-action="close" aria-label="關閉">${i('x')}</button></div>${content}${['time','rain','weekdays','snooze','sound','source','schedule'].includes(modal)?`<div class="sheet-sync" role="status">${syncMarkup()}</div>`:''}`;iconize();if(restoreFocus){const match=[...sheet.querySelectorAll('button,input,select,textarea')].find(el=>(focusData.key&&el.dataset.key===focusData.key)||(focusData.choice&&el.dataset.choice===focusData.choice&&el.dataset.value===focusData.value)||(focusData.action&&el.dataset.action===focusData.action));(match||sheet.querySelector('.close'))?.focus()}}
root.addEventListener('click',e=>{const clear=e.target.closest('[data-clear]');if(clear){state[clear.dataset.clear]='';dirty();return}const tab=e.target.closest('[data-tab]');if(tab){closeSheet();state.tab=tab.dataset.tab;state.page='';toastEl.hidden=true;render();stage.scrollTop=0;return}const day=e.target.closest('[data-day]');if(day){state.selectedDay=Number(day.dataset.day);render();return}const choice=e.target.closest('[data-choice]');if(choice){const {choice:key,value}=choice.dataset;if(key==='override'){const k=`${state.year}-${state.month+1}-${state.selectedDay}`;if(value==='auto')delete state.overrides[k];else state.overrides[k]=value;dirty()}else if(key==='format'){state.format=value;render();announce('時間格式已儲存')}else{state[key]=value;dirty();if(key==='sound'&&value==='AI 語音'){modal='voice';renderSheet()}else if(modal)renderSheet()}return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='close'){closeSheet();return}if(a==='retry'){dirty();return}if(a==='center-map'){root.querySelector('.map-media').style.transform='';return}if(a==='dismiss-toast'){toastEl.hidden=true;return}if(a==='back'){state.page=state.page==='calendar'?'dates':state.page==='other'?'dates':(['format','evening','dates','permissions','privacy','about'].includes(state.page)?'':'');render();stage.scrollTop=0;return}if(['dates','evening','format','permissions','privacy','about','other','calendar'].includes(a)){state.tab='settings';state.page=a;render();stage.scrollTop=0;return}if(a==='prev-month'||a==='next-month'){const d=new Date(state.year,state.month+(a==='prev-month'?-1:1),1);if(d.getFullYear()<2026||d.getFullYear()>2027)return;state.year=d.getFullYear();state.month=d.getMonth();state.selectedDay=1;render();return}if(a==='confirm-reset'){Object.keys(state.overrides).filter(k=>k.startsWith(state.year+'-')).forEach(k=>delete state.overrides[k]);closeSheet();dirty();announce('已重設手動日期，正在自動更新');return}if(a==='refresh-data'){closeSheet();toast('假日資料檢查完成','示範流程，未連線下載',null);return}openSheet(a)});
root.addEventListener('input',e=>{const key=e.target.dataset.key;if(!key)return;if(e.target.type==='range'){state[key]=Number(e.target.value);dirty(false);sheet.querySelector(`[data-output="${key}"]`).textContent=state[key];render();if(modal==='rain'){sheet.querySelector('.note').innerHTML=`沿途任一點降雨機率達到 ${state.threshold}%，鬧鐘就提早 ${state.lead} 分鐘。<br>例如 ${fmt(state.hour,state.minute)} → ${hm(state.hour*60+state.minute-state.lead)}。`}return}if(key==='home'||key==='workplace'){state[key]=e.target.value;dirty(false)}});
root.addEventListener('change',e=>{const el=e.target;if(el.dataset.weekday!==undefined){const d=Number(el.dataset.weekday);state.weekdays=el.checked?[...state.weekdays,d].sort():state.weekdays.filter(v=>v!==d);dirty();return}const key=el.dataset.key;if(!key||el.type==='range')return;if(key==='alarmTime'){if(!el.value)return;[state.hour,state.minute]=el.value.split(':').map(Number);dirty();return}if(key==='eveningTime'){if(!el.value)return;state.eveningTime=el.value;render();announce('提醒時間已儲存');return}state[key]=el.type==='checkbox'?el.checked:el.value;if(['evening','work','school'].includes(key)){render();announce('偏好已儲存')}else dirty();if(modal)renderSheet()});
let mapDrag=null;
root.addEventListener('pointerdown',e=>{const map=e.target.closest('.original-map');if(!map||e.target.closest('button'))return;mapDrag={map,x:e.clientX,y:e.clientY};map.setPointerCapture(e.pointerId)});
root.addEventListener('pointermove',e=>{if(!mapDrag)return;const x=Math.max(-70,Math.min(70,e.clientX-mapDrag.x)),y=Math.max(-50,Math.min(50,e.clientY-mapDrag.y));mapDrag.map.querySelector('.map-media').style.transform=`translate(${x}px,${y}px) scale(1.5)`});
root.addEventListener('pointerup',()=>mapDrag=null);
root.addEventListener('pointercancel',()=>mapDrag=null);
layer.addEventListener('click',e=>{if(e.target===layer)closeSheet()});
root.addEventListener('keydown',e=>{if(layer.hidden)return;if(e.key==='Escape'){e.preventDefault();closeSheet()}if(e.key==='Tab'){const els=[...sheet.querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea')];const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{clearTimeout(scheduleTimer);++syncRevision;state.busy=false;state.dirty=false;state.issue='';state.armed=cfg.scenario!=='empty';state.error=false;render();if(modal)renderSheet()}});tweak.addSelect(cfg,'size',{label:'螢幕高度',options:[{label:'一般手機',value:'standard'},{label:'小螢幕 · 667',value:'compact'}]});tweak.addSelect(cfg,'scenario',{label:'排程情境',options:[{label:'正常啟用',value:'ready'},{label:'首次設定',value:'empty'},{label:'天氣待更新',value:'weather'},{label:'模擬更新失敗',value:'failure'}]})}
})();
</script>
